<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <!-- NAVBAR -->
  <nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">Product Dashboard</span>
    </div>
  </nav>

  <div class="container mt-4">

    <!-- FORM CARD -->
    <div class="card shadow-sm p-3 mb-4">
      <h5 id="form-title">Add Product</h5>

      <div class="row g-2">
        <div class="col-md-4">
          <input id="name" class="form-control" placeholder="Product Name">
        </div>

        <div class="col-md-3">
          <input id="price" class="form-control" placeholder="Price">
        </div>

        <div class="col-md-3">
          <input id="category" class="form-control" placeholder="Category">
        </div>

        <div class="col-md-2">
          <button id="submit-btn" class="btn btn-primary w-100" onclick="AddProduct()">
            Add
          </button>
        </div>
      </div>
    </div>

    <!-- SEARCH -->
    <input 
      id="search" 
      class="form-control mb-3" 
      placeholder="Search products..." 
      onkeyup="searchProducts()"
    >

    <!-- PRODUCT LIST -->
    <div id="product-list" class="row"></div>

  </div>

  <script src="app.js"></script>
</body>
</html>
