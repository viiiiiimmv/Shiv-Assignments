<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOLLARS DEMO</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="text/javascript" language="Javascript">
         var friends = ["sunitha", "mahesh", "kiran", "sanmay"];

            var objs = [{ "name": "sita", "age": "23" }, { "name": "rajesh", "age": "55" }, { "name": "kiran", "age": "22" },
            { "name": "praveen", "age": "27" }]

            $(document).ready(

                function (){
                    $.each(friends, function(index, value){
                        console.log(`${index+1}:${value}`)
                    })

                    $.each(objs, function(index, value){
                        console.log(`${index+1} --> NAME : ${value.name} --> AGE : ${value.age}`)
                    })

                    console.log("I WANNA ITERATE THE LIST ...")
                    $('li').each(function(index, value){
                        console.log(`${index+1} --> ${$(value).text()}`)
                    })

                    console.log("I WANNA ITERATE USING REFERENCES ...")
                    $('li').each(function(index, value){
                        console.log(`${index + 1} --> ${$(this).text()}`)
                    })
                }

            );
    </script>
</head>
<body>
    <ul>
        <li>US</li>
        <li>India</li>
        <li>UK</li>
        <li>Canada</li>
        <li>Australia</li>
    </ul>
    <div id="divresult" style="background-color: yellow;"></div> 
</body>
</html>
